[project]
name = "agent"
version = "0.1.0"
description = "OpenVINO models conversion and inference agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "openvino-genai==2026.4.0.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
    "json-repair==0.60.1",
    "openai==2.48.0",
]

[project.optional-dependencies]
dev = [
    "pylint==4.0.6",
    "astroid==4.0.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["."]