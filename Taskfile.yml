version: "3"

tasks:
  install:
    desc: Install dependencies using uv
    cmds:
      - uv sync
    sources:
      - pyproject.toml
    generates:
      - ".venv/**/*"
      - uv.lock

  lock:
    desc: Regenerate lock file
    cmds:
      - uv lock

  test:
    desc: Run tests
    cmds:
      - uv sync --all-extras
      - uv run python -m pytest agent -v

  lint:
    desc: Run linters
    cmds:
      - uv run pylint agent

  dist:
    desc: Build standalone executable
    cmds:
      - uv run pyinstaller --onefile agent.py

  clean:
    desc: Clean build artifacts
    cmds:
      - rmdir /s /q .venv
      - rmdir /s /q .pytest_cache
      - rmdir /s /q build
      - rmdir /s /q dist
    silent: true