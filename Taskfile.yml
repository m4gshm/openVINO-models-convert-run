version: "3"

tasks:
  install:
    desc: Install dependencies using uv
    cmds:
#      - uv python install 3.14
      - uv venv --clear --python 3.14
      - uv sync
    sources:
      - pyproject.toml
      - agent/pyproject.toml
      - experiments/pyproject.toml
    generates:
      - ".venv/**/*"
      - uv.lock

  lock:
    desc: Regenerate lock file
    cmds:
      - uv lock

  update:
    desc: Regenerate lock file
    cmds:
      - uv lock --upgrade
      - uv sync

  test:
    desc: Run tests
    cmds:
      - uv sync --all-extras
      - uv run python -m pytest agent -v

  e2e:
    desc: Run the real-model end-to-end suite (downloads OpenVINO/Qwen3.5-2B-int4-ov into models/ on first run)
    cmds:
      - uv run python -m pytest agent/e2e_test.py -m e2e -v

  lint:
    desc: Run linters
    cmds:
      - uv run pylint agent

  typecheck:
    desc: Run static type checks (mypy)
    cmds:
      - uv run mypy

  dist:
    desc: Build standalone executable
    cmds:
      - uv run pyinstaller --onefile agent.py

  clean:
    desc: Clean build artifacts
    cmds:
      - rmdir /s /q .venv
      - rmdir /s /q .pytest_cache
      - rmdir /s /q build
      - rmdir /s /q dist
    silent: true